<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252d35"><meta name="apple-mobile-web-app-capable" content="yes"><title>나의 잠금화면 일정</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#fff}*{box-sizing:border-box}body{margin:0;background:#242b35}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100svh;position:relative;isolation:isolate;padding:calc(env(safe-area-inset-top) + 34px) 20px calc(env(safe-area-inset-bottom) + 35px);max-width:600px;margin:auto}.bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(145deg,#526e80,#a19e9d 55%,#55536a);background-size:cover;background-position:center}.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,22,31,.25),rgba(11,18,27,.48))}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:2px;opacity:.8}.heading{font-size:30px;font-weight:700;margin:10px 0 3px}.sub{opacity:.8;font-size:13px}.actions{display:flex;gap:8px;margin:23px 0 28px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.17);color:white;border-radius:16px;padding:12px 14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:12px;font-weight:600}.btn.primary{background:rgba(255,255,255,.9);color:#27313b;border:0}.glass{background:rgba(35,43,55,.29);border:1px solid rgba(255,255,255,.36);box-shadow:0 14px 45px rgba(0,0,0,.11);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px;padding:16px}.week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.week-head strong{font-size:17px}.nav{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:6px 12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.day{border:0;background:transparent;color:#fff;border-radius:13px;padding:7px 1px;display:flex;align-items:center;flex-direction:column;gap:5px}.day small{font-size:11px;opacity:.7}.day b{font-size:15px}.day.selected{background:rgba(255,255,255,.86);color:#303b46}.day.selected small{opacity:1}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 12px;font-size:17px;font-weight:700}.count{font-size:12px;opacity:.7}.events{display:grid;gap:9px}.event{width:100%;border:1px solid rgba(255,255,255,.22);background:rgba(29,37,49,.37);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:white;text-align:left;border-radius:17px;padding:14px;display:flex;align-items:center;gap:12px}.dot{width:5px;height:34px;background:#d9f4df;border-radius:9px}.event-info{flex:1}.event-info strong{display:block;font-size:14px}.event-info span{display:block;font-size:12px;opacity:.7;margin-top:4px}.empty{text-align:center;padding:35px 15px;font-size:13px;opacity:.75}.today-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);border-radius:10px;color:#fff;padding:6px 10px;font-size:12px;margin-right:6px}.hint{text-align:center;font-size:11px;opacity:.7;margin-top:24px;line-height:1.6}dialog{border:1px solid #e5e7eb;border-radius:22px;padding:23px;width:calc(100% - 36px);max-width:440px;color:#26313c}dialog::backdrop{background:rgba(0,0,0,.55)}dialog h2{margin:0 0 17px;font-size:21px}label{display:block;font-size:13px;margin:13px 0 5px}input[type=text],input[type=date],input[type=time]{display:block;width:100%;padding:12px;border:1px solid #cbd1d8;border-radius:11px;background:#fff;color:#26313c}.form-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.form-actions button{padding:11px 15px;border:0;border-radius:12px;background:#293d4e;color:white}.form-actions .muted{background:#e8edf1;color:#26313c}.form-actions .danger{background:#a33b3b}#photo{display:none}.mode-tabs{display:flex;gap:7px;margin:12px 0}.mode-tabs button{flex:1;border:1px solid #cbd1d8;border-radius:10px;background:#f1f4f6;padding:10px;color:#26313c}.mode-tabs button.active{background:#293d4e;color:white}.date-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.date-row label{margin-top:4px}.chosen{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.chosen button{background:#e8edf1;border:0;border-radius:20px;padding:8px;color:#26313c;font-size:12px}.small-help{font-size:12px;color:#667381;margin:8px 0}.position{margin-top:14px}.position-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.position label{display:flex;justify-content:space-between;font-size:12px;margin:8px 0}.position input{width:100%;accent-color:#fff}.position button{border:1px solid #ffffff55;border-radius:9px;background:#ffffff2b;color:#fff;padding:6px 9px;font-size:12px}.schedule-wrap{position:relative;touch-action:pan-y}.schedule-wrap.dragging{touch-action:none;outline:1px dashed #ffffff88;border-radius:20px}.drag-hint{font-size:11px;opacity:.8;margin-top:8px}.app{overflow:hidden}
</style></head><body><main class="app"><div class="bg" id="bg"></div><div class="shade"></div><div class="top"><div class="eyebrow">MY LITTLE MOMENTS</div><span id="todayLabel" class="sub"></span></div><h1 class="heading">나의 한 주</h1><div class="sub">소중한 순간을 차곡차곡 기록해요.</div><div class="actions"><button class="btn" id="pickPhoto">＋ 배경 사진</button><button class="btn primary" id="add">＋ 일정 추가</button><button class="btn" id="save">↓ 이미지 저장</button></div><input type="file" id="photo" accept="image/*"><section class="glass"><div class="week-head"><strong id="weekLabel"></strong><div><button class="today-btn" id="goToday">오늘</button><button class="nav" id="prev" aria-label="이전 주">‹</button> <button class="nav" id="next" aria-label="다음 주">›</button></div></div><div class="days" id="days"></div></section><section class="glass position"><div class="position-head"><strong style="font-size:14px">일정표 위치 조절</strong><button id="resetPosition">초기화</button></div><label>좌우 위치 <span id="xValue">0</span></label><input id="posX" type="range" min="-80" max="80" value="0"><label>상하 위치 <span id="yValue">0</span></label><input id="posY" type="range" min="-140" max="260" value="0"><div class="drag-hint">아래 일정표를 손가락으로 끌어서 이동할 수도 있어요. 저장 이미지에도 반영됩니다.</div></section><div class="schedule-wrap" id="scheduleWrap"><div class="section-title"><span id="selectedLabel">일정</span><span class="count" id="count"></span></div><div class="events" id="events"></div></div><div class="hint">일정을 누르면 수정하거나 삭제할 수 있어요.<br>이미지 저장은 선택한 주의 일정을 담습니다.</div></main><dialog id="editor"><form id="eventForm"><h2 id="formTitle">일정 추가</h2><label for="name">일정 이름</label><input id="name" type="text" maxlength="80" required placeholder="예: 친구와 점심"><label>날짜 선택 방식</label><div class="mode-tabs"><button type="button" id="rangeMode" class="active">시작일 ~ 종료일</button><button type="button" id="multiMode">여러 날짜 선택</button></div><div id="rangeFields" class="date-row"><div><label for="startDate">시작 날짜</label><input id="startDate" type="date"></div><div><label for="endDate">종료 날짜</label><input id="endDate" type="date"></div></div><div id="multiFields" hidden><label for="extraDate">날짜 추가</label><div style="display:flex;gap:7px"><input id="extraDate" type="date"><button type="button" id="pushDate" style="border:0;border-radius:10px;background:#293d4e;color:white;min-width:65px">추가</button></div><div class="chosen" id="chosenDates"></div><p class="small-help">날짜를 여러 개 추가하세요. 선택한 모든 날짜에 같은 일정이 표시됩니다.</p></div><label for="time">시간 (선택)</label><input id="time" type="time"><div class="form-actions"><button type="submit">저장</button><button type="button" class="muted" id="cancel">취소</button><button type="button" class="danger" id="delete" hidden>삭제</button></div></form></dialog><script>
const $=s=>document.querySelector(s),key='my-lockscreen-v2-events',photoKey='my-lockscreen-v2-photo';let events=[],selected=new Date(),weekShift=0,editId=null,bgData='',lastSeenDate='',dateMode='range',chosenDates=[],position={x:0,y:0};try{position=JSON.parse(localStorage.getItem('my-lockscreen-position')||'{"x":0,"y":0}')}catch{}const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,dayNames=['일','월','화','수','목','금','토'];try{events=JSON.parse(localStorage.getItem(key)||'[]');bgData=localStorage.getItem(photoKey)||''}catch{}if(bgData)$('#bg').style.backgroundImage=`url(${JSON.stringify(bgData)})`;function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7+weekShift*7);return x}function dates(){let m=monday(new Date());return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d})}function eventDates(e){if(Array.isArray(e.dates)&&e.dates.length)return e.dates;if(e.startDate&&e.endDate){let a=new Date(e.startDate+'T12:00:00'),b=new Date(e.endDate+'T12:00:00'),out=[];for(let i=0;a<=b&&i<366;i++,a.setDate(a.getDate()+1))out.push(iso(a));return out}return e.date?[e.date]:[]}function render(){lastSeenDate=iso(new Date());const ds=dates(),first=ds[0],last=ds[6];$('#todayLabel').textContent=`${new Date().getMonth()+1}월 ${new Date().getDate()}일`; $('#weekLabel').textContent=`${first.getMonth()+1}월 ${first.getDate()}일 — ${last.getMonth()+1}월 ${last.getDate()}일`;$('#days').replaceChildren();ds.forEach(d=>{let b=document.createElement('button');b.className='day'+(iso(d)===iso(selected)?' selected':'');b.innerHTML=`<small>${dayNames[d.getDay()]}</small><b>${d.getDate()}</b>`;b.onclick=()=>{selected=d;render()};$('#days').append(b)});$('#selectedLabel').textContent=`${selected.getMonth()+1}월 ${selected.getDate()}일 · ${dayNames[selected.getDay()]}요일`;const list=events.filter(e=>eventDates(e).includes(iso(selected))).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('#count').textContent=`${list.length}개의 일정`;$('#events').replaceChildren();if(!list.length){let e=document.createElement('div');e.className='glass empty';e.textContent='아직 일정이 없어요. 오늘의 순간을 추가해 보세요.';$('#events').append(e)}list.forEach(e=>{let b=document.createElement('button');b.className='event';let dot=document.createElement('span');dot.className='dot';let info=document.createElement('span');info.className='event-info';let title=document.createElement('strong');title.textContent=e.name;let time=document.createElement('span');time.textContent=e.time||'하루 종일';info.append(title,time);b.append(dot,info);b.onclick=()=>openEditor(e);$('#events').append(b)})}function setMode(mode){dateMode=mode;$('#rangeFields').hidden=mode!=='range';$('#multiFields').hidden=mode!=='multi';$('#rangeMode').classList.toggle('active',mode==='range');$('#multiMode').classList.toggle('active',mode==='multi');renderChosen()}function renderChosen(){$('#chosenDates').replaceChildren();chosenDates.sort().forEach(d=>{let b=document.createElement('button');b.type='button';b.textContent=d+' ×';b.onclick=()=>{chosenDates=chosenDates.filter(v=>v!==d);renderChosen()};$('#chosenDates').append(b)})}$('#rangeMode').onclick=()=>setMode('range');$('#multiMode').onclick=()=>setMode('multi');$('#pushDate').onclick=()=>{let d=$('#extraDate').value;if(d&&!chosenDates.includes(d)){chosenDates.push(d);renderChosen()}};function openEditor(e){editId=e?.id||null;$('#formTitle').textContent=e?'일정 수정':'일정 추가';$('#name').value=e?.name||'';$('#time').value=e?.time||'';let ds=e?eventDates(e):[iso(selected)];$('#startDate').value=e?.startDate||ds[0];$('#endDate').value=e?.endDate||ds[ds.length-1];$('#extraDate').value=iso(selected);chosenDates=[...ds];setMode(e?.dates?'multi':'range');$('#delete').hidden=!e;$('#editor').showModal()}
$('#add').onclick=()=>openEditor();$('#cancel').onclick=()=>$('#editor').close();$('#eventForm').onsubmit=ev=>{ev.preventDefault();let obj={id:editId||String(Date.now())+Math.random(),name:$('#name').value.trim(),time:$('#time').value};if(!obj.name)return;if(dateMode==='range'){obj.startDate=$('#startDate').value;obj.endDate=$('#endDate').value;if(!obj.startDate||!obj.endDate||obj.endDate<obj.startDate)return alert('시작일과 종료일을 확인해 주세요.');let days=Math.round((new Date(obj.endDate)-new Date(obj.startDate))/86400000);if(days>365)return alert('기간은 최대 366일까지 설정할 수 있어요.')}else{if(!chosenDates.length)return alert('날짜를 한 개 이상 추가해 주세요.');obj.dates=[...chosenDates].sort()}events=editId?events.map(e=>e.id===editId?obj:e):[...events,obj];try{localStorage.setItem(key,JSON.stringify(events))}catch{alert('저장 공간이 부족합니다.')}let first=eventDates(obj)[0];selected=new Date(first+'T12:00:00');weekShift=0;let today=monday(new Date()),target=new Date(selected);target.setDate(target.getDate()-(target.getDay()+6)%7);weekShift=Math.round((target-today)/604800000);$('#editor').close();render()};$('#delete').onclick=()=>{if(!confirm('이 일정을 삭제할까요?'))return;events=events.filter(e=>e.id!==editId);localStorage.setItem(key,JSON.stringify(events));$('#editor').close();render()};$('#goToday').onclick=()=>{selected=new Date();weekShift=0;render()};$('#prev').onclick=()=>{weekShift--;selected=dates()[0];render()};$('#next').onclick=()=>{weekShift++;selected=dates()[0];render()};$('#pickPhoto').onclick=()=>$('#photo').click();$('#photo').onchange=()=>{let file=$('#photo').files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1500/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);bgData=c.toDataURL('image/jpeg',.82);$('#bg').style.backgroundImage=`url(${JSON.stringify(bgData)})`;try{localStorage.setItem(photoKey,bgData)}catch{alert('사진은 적용되었지만 저장 공간 부족으로 다음 실행 시 유지되지 않을 수 있어요.')}};img.src=reader.result};reader.readAsDataURL(file)};
$('#save').onclick=async()=>{const c=document.createElement('canvas');c.width=1290;c.height=2796;const x=c.getContext('2d');const paint=()=>{let g=x.createLinearGradient(0,0,1290,2796);g.addColorStop(0,'#536f80');g.addColorStop(1,'#4a4b60');x.fillStyle=g;x.fillRect(0,0,1290,2796)};paint();if(bgData){try{let im=new Image();im.src=bgData;await im.decode();let scale=Math.max(c.width/im.width,c.height/im.height),w=im.width*scale,h=im.height*scale;x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h)}catch{}}let shade=x.createLinearGradient(0,0,0,2796);shade.addColorStop(0,'rgba(0,0,0,.2)');shade.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=shade;x.fillRect(0,0,1290,2796);x.fillStyle='#fff';x.textAlign='center';x.font='500 44px sans-serif';x.fillText('MY LITTLE MOMENTS',645,860);x.font='bold 90px sans-serif';x.fillText('나의 한 주',645,985);const ds=dates();x.font='42px sans-serif';x.fillText(`${ds[0].getMonth()+1}.${ds[0].getDate()} — ${ds[6].getMonth()+1}.${ds[6].getDate()}`,645,1060);x.fillStyle='rgba(255,255,255,.19)';x.beginPath();x.roundRect(85+position.x*3,1190+position.y*3,1120,Math.min(1100,245+events.filter(e=>ds.some(d=>eventDates(e).includes(iso(d)))).length*90),42);x.fill();x.fillStyle='#fff';x.textAlign='left';x.font='bold 48px sans-serif';x.fillText('이번 주 일정',145+position.x*3,1290+position.y*3);let weekly=events.filter(e=>ds.some(d=>eventDates(e).includes(iso(d)))).sort((a,b)=>((eventDates(a).find(v=>ds.some(d=>iso(d)===v))||'')+a.time).localeCompare((eventDates(b).find(v=>ds.some(d=>iso(d)===v))||'')+b.time));x.font='37px sans-serif';if(!weekly.length)x.fillText('등록된 일정이 없어요',145+position.x*3,1400+position.y*3);weekly.slice(0,9).forEach((e,i)=>{let matched=eventDates(e).find(v=>ds.some(d=>iso(d)===v));let d=new Date(matched+'T12:00:00');let text=`${d.getMonth()+1}/${d.getDate()}  ${e.time||'종일'}  ${e.name}`;while(x.measureText(text).width>980&&text.length>6)text=text.slice(0,-2)+'…';x.fillText(text,145+position.x*3,1400+position.y*3+i*90)});const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)return alert('이미지 생성에 실패했습니다.');const file=new File([blob],'my-lockscreen.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'나의 잠금화면'});return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-lockscreen.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};function updatePosition(){position.x=Number($('#posX').value);position.y=Number($('#posY').value);$('#xValue').textContent=position.x;$('#yValue').textContent=position.y;$('#scheduleWrap').style.transform=`translate(${position.x}px,${position.y}px)`;try{localStorage.setItem('my-lockscreen-position',JSON.stringify(position))}catch{}}$('#posX').value=position.x;$('#posY').value=position.y;$('#posX').oninput=updatePosition;$('#posY').oninput=updatePosition;$('#resetPosition').onclick=()=>{$('#posX').value=0;$('#posY').value=0;updatePosition()};let drag=null;$('#scheduleWrap').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,px:position.x,py:position.y};$('#scheduleWrap').classList.add('dragging');$('#scheduleWrap').setPointerCapture(e.pointerId)});$('#scheduleWrap').addEventListener('pointermove',e=>{if(!drag)return;$('#posX').value=Math.max(-80,Math.min(80,drag.px+e.clientX-drag.x));$('#posY').value=Math.max(-140,Math.min(260,drag.py+e.clientY-drag.y));updatePosition()});function stopDrag(){drag=null;$('#scheduleWrap').classList.remove('dragging')}$('#scheduleWrap').addEventListener('pointerup',stopDrag);$('#scheduleWrap').addEventListener('pointercancel',stopDrag);updatePosition();document.addEventListener('visibilitychange' ,()=>{if(!document.hidden&&lastSeenDate!==iso(new Date())){selected=new Date();weekShift=0;render()}});window.addEventListener('pageshow',()=>{if(lastSeenDate!==iso(new Date())){selected=new Date();weekShift=0;render()}});render();
</script></body></html>
