</style></head><body><main class="app"><div class="bg" id="bg"></div><div class="shade"></div><div class="top"><span class="eyebrow">LOCKSCREEN STUDIO</span><span id="todayLabel" class="sub"></span></div><div class="actions"><button class="btn" id="pickPhoto">＋ 배경 사진</button><button class="btn primary" id="add">＋ 일정 추가</button><button class="btn" id="toggleSettings">⚙ 배치 설정</button><button class="btn primary" id="save">↓ 이미지 저장</button></div><input type="file" id="photo" accept="image/*"><section class="settings-panel" id="settingsPanel" hidden><div class="settings-head"><strong>배치 설정</strong><button type="button" id="resetPosition">위치 초기화</button></div><p>아래 미리보기의 제목과 일정 카드를 함께 움직입니다. 사진에서 잘 보이는 위치를 선택하세요.</p><label>가로 위치 <output id="xValue">0</output></label><input id="posX" type="range" min="-90" max="90" value="0"><label>세로 위치 <output id="yValue">0</output></label><input id="posY" type="range" min="-240" max="360" value="0"><label>카드 진하기 <output id="opacityValue">45%</output></label><input id="opacity" type="range" min="15" max="85" value="45"><button type="button" class="settings-done" id="closeSettings">설정 완료 · 미리보기</button></section><section class="preview-area"><div class="preview-caption"><strong>잠금화면 미리보기</strong><span>제목 + 일정 카드 함께 이동</span></div><div class="preview-stage" id="previewStage"><div class="preview-time">9:41</div><div class="schedule-wrap" id="scheduleWrap"><div class="bundle-title"><div class="eyebrow">MY LITTLE MOMENTS</div><h1>나의 한 주</h1><span id="bundleWeek"></span></div><div class="bundle-card"><div class="bundle-head"><strong>이번 주 일정</strong><span id="weeklyCount"></span></div><div id="weeklyEvents" class="weekly-events"></div></div></div></div><div class="drag-hint">↕ 미리보기에서 제목과 일정 카드를 손가락으로 끌어 이동하세요.</div></section><section class="glass editor-calendar"><div class="week-head"><strong id="weekLabel"></strong><div><button class="today-btn" id="goToday">오늘</button><button class="nav" id="prev" aria-label="이전 주">‹</button> <button class="nav" id="next" aria-label="다음 주">›</button></div></div><div class="days" id="days"></div><div class="section-title"><span id="selectedLabel">일정</span><span class="count" id="count"></span></div><div class="events" id="events"></div></section><div class="hint">날짜를 선택해 일정을 관리하세요. 저장 이미지에는 미리보기의 제목과 주간 일정이 함께 담깁니다.</div></main><dialog id="editor"><form id="eventForm"><h2 id="formTitle">일정 추가</h2><label for="name">일정 이름</label><input id="name" type="text" maxlength="80" required placeholder="예: 친구와 점심"><label>날짜 선택 방식</label><div class="mode-tabs"><button type="button" id="rangeMode" class="active">시작일 ~ 종료일</button><button type="button" id="multiMode">여러 날짜 선택</button></div><div id="rangeFields" class="date-row"><div><label for="startDate">시작 날짜</label><input id="startDate" type="date"></div><div><label for="endDate">종료 날짜</label><input id="endDate" type="date"></div></div><div id="multiFields" hidden><label for="extraDate">날짜 추가</label><div style="display:flex;gap:7px"><input id="extraDate" type="date"><button type="button" id="pushDate" style="border:0;border-radius:10px;background:#293d4e;color:white;min-width:65px">추가</button></div><div class="chosen" id="chosenDates"></div><p class="small-help">날짜를 여러 개 추가하세요. 선택한 모든 날짜에 같은 일정이 표시됩니다.</p></div><label for="time">시간 (선택)</label><input id="time" type="time"><div class="form-actions"><button type="submit">저장</button><button type="button" class="muted" id="cancel">취소</button><button type="button" class="danger" id="delete" hidden>삭제</button></div></form></dialog><script>
const $=s=>document.querySelector(s),key='my-lockscreen-v2-events',photoKey='my-lockscreen-v2-photo';let events=[],selected=new Date(),weekShift=0,editId=null,bgData='',lastSeenDate='',dateMode='range',chosenDates=[],position={x:0,y:0};try{position=JSON.parse(localStorage.getItem('my-lockscreen-position')||'{"x":0,"y":0}')}catch{}const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,dayNames=['일','월','화','수','목','금','토'];try{events=JSON.parse(localStorage.getItem(key)||'[]');bgData=localStorage.getItem(photoKey)||''}catch{}if(bgData){$('#bg').style.backgroundImage=`url(${JSON.stringify(bgData)})`;document.documentElement.style.setProperty('--preview-bg',`url(${JSON.stringify(bgData)})`)}function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7+weekShift*7);return x}function dates(){let m=monday(new Date());return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d})}function eventDates(e){if(Array.isArray(e.dates)&&e.dates.length)return e.dates;if(e.startDate&&e.endDate){let a=new Date(e.startDate+'T12:00:00'),b=new Date(e.endDate+'T12:00:00'),out=[];for(let i=0;a<=b&&i<366;i++,a.setDate(a.getDate()+1))out.push(iso(a));return out}return e.date?[e.date]:[]}function render(){lastSeenDate=iso(new Date());const ds=dates(),first=ds[0],last=ds[6];$('#todayLabel').textContent=`${new Date().getMonth()+1}월 ${new Date().getDate()}일`; $('#weekLabel').textContent=`${first.getMonth()+1}월 ${first.getDate()}일 — ${last.getMonth()+1}월 ${last.getDate()}일`;$('#days').replaceChildren();ds.forEach(d=>{let b=document.createElement('button');b.className='day'+(iso(d)===iso(selected)?' selected':'');b.innerHTML=`<small>${dayNames[d.getDay()]}</small><b>${d.getDate()}</b>`;b.onclick=()=>{selected=d;render()};$('#days').append(b)});$('#selectedLabel').textContent=`${selected.getMonth()+1}월 ${selected.getDate()}일 · ${dayNames[selected.getDay()]}요일`;const list=events.filter(e=>eventDates(e).includes(iso(selected))).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('#count').textContent=`${list.length}개의 일정`;$('#events').replaceChildren();if(!list.length){let e=document.createElement('div');e.className='glass empty';e.textContent='아직 일정이 없어요. 오늘의 순간을 추가해 보세요.';$('#events').append(e)}list.forEach(e=>{let b=document.createElement('button');b.className='event';let dot=document.createElement('span');dot.className='dot';let info=document.createElement('span');info.className='event-info';let title=document.createElement('strong');title.textContent=e.name;let time=document.createElement('span');time.textContent=e.time||'하루 종일';info.append(title,time);b.append(dot,info);b.onclick=()=>openEditor(e);$('#events').append(b)});renderPreview()}function setMode(mode){dateMode=mode;$('#rangeFields').hidden=mode!=='range';$('#multiFields').hidden=mode!=='multi';$('#rangeMode').classList.toggle('active',mode==='range');$('#multiMode').classList.toggle('active',mode==='multi');renderChosen()}function renderChosen(){$('#chosenDates').replaceChildren();chosenDates.sort().forEach(d=>{let b=document.createElement('button');b.type='button';b.textContent=d+' ×';b.onclick=()=>{chosenDates=chosenDates.filter(v=>v!==d);renderChosen()};$('#chosenDates').append(b)})}$('#rangeMode').onclick=()=>setMode('range');$('#multiMode').onclick=()=>setMode('multi');$('#pushDate').onclick=()=>{let d=$('#extraDate').value;if(d&&!chosenDates.includes(d)){chosenDates.push(d);renderChosen()}};function openEditor(e){editId=e?.id||null;$('#formTitle').textContent=e?'일정 수정':'일정 추가';$('#name').value=e?.name||'';$('#time').value=e?.time||'';let ds=e?eventDates(e):[iso(selected)];$('#startDate').value=e?.startDate||ds[0];$('#endDate').value=e?.endDate||ds[ds.length-1];$('#extraDate').value=iso(selected);chosenDates=[...ds];setMode(e?.dates?'multi':'range');$('#delete').hidden=!e;$('#editor').showModal()}
$('#add').onclick=()=>openEditor();$('#cancel').onclick=()=>$('#editor').close();$('#eventForm').onsubmit=ev=>{ev.preventDefault();let obj={id:editId||String(Date.now())+Math.random(),name:$('#name').value.trim(),time:$('#time').value};if(!obj.name)return;if(dateMode==='range'){obj.startDate=$('#startDate').value;obj.endDate=$('#endDate').value;if(!obj.startDate||!obj.endDate||obj.endDate<obj.startDate)return alert('시작일과 종료일을 확인해 주세요.');let days=Math.round((new Date(obj.endDate)-new Date(obj.startDate))/86400000);if(days>365)return alert('기간은 최대 366일까지 설정할 수 있어요.')}else{if(!chosenDates.length)return alert('날짜를 한 개 이상 추가해 주세요.');obj.dates=[...chosenDates].sort()}events=editId?events.map(e=>e.id===editId?obj:e):[...events,obj];try{localStorage.setItem(key,JSON.stringify(events))}catch{alert('저장 공간이 부족합니다.')}let first=eventDates(obj)[0];selected=new Date(first+'T12:00:00');weekShift=0;let today=monday(new Date()),target=new Date(selected);target.setDate(target.getDate()-(target.getDay()+6)%7);weekShift=Math.round((target-today)/604800000);$('#editor').close();render()};$('#delete').onclick=()=>{if(!confirm('이 일정을 삭제할까요?'))return;events=events.filter(e=>e.id!==editId);localStorage.setItem(key,JSON.stringify(events));$('#editor').close();render()};$('#goToday').onclick=()=>{selected=new Date();weekShift=0;render()};$('#prev').onclick=()=>{weekShift--;selected=dates()[0];render()};$('#next').onclick=()=>{weekShift++;selected=dates()[0];render()};$('#pickPhoto').onclick=()=>$('#photo').click();$('#photo').onchange=()=>{let file=$('#photo').files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1500/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);bgData=c.toDataURL('image/jpeg',.82);$('#bg').style.backgroundImage=`url(${JSON.stringify(bgData)})`;document.d const positionKey='my-lockscreen-position';let opacity=Number(localStorage.getItem('my-lockscreen-card-opacity')||45);function weeklyRows(){const ds=dates(),keys=ds.map(iso),out=[];events.forEach(e=>{const matches=eventDates(e).filter(d=>keys.includes(d));matches.forEach(d=>out.push({date:d,time:e.time||'',name:e.name}))});out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return out}function renderPreview(){const ds=dates(),rows=weeklyRows();$('#bundleWeek').textContent=`${ds[0].getMonth()+1}.${ds[0].getDate()} — ${ds[6].getMonth()+1}.${ds[6].getDate()}`;$('#weeklyCount').textContent=rows.length+'개';const box=$('#weeklyEvents');box.replaceChildren();if(!rows.length){let v=document.createElement('div');v.className='weekly-item';v.textContent='이번 주에 등록된 일정이 없어요';box.append(v)}rows.slice(0,8).forEach(r=>{let v=document.createElement('div');v.className='weekly-item';let a=document.createElement('span');a.className='when';let d=new Date(r.date+'T12:00:00');a.textContent=`${d.getMonth()+1}/${d.getDate()} ${r.time||'종일'}`;let b=document.createElement('span');b.className='what';b.textContent=r.name;v.append(a,b);box.append(v)});if(rows.length>8){let more=document.createElement('div');more.className='weekly-more';more.textContent=`외 ${rows.length-8}개 일정`;box.append(more)}}function updatePosition(){position.x=Number($('#posX').value);position.y=Number($('#posY').value);$('#xValue').textContent=position.x;$('#yValue').textContent=position.y;const stage=$('#previewStage');let scale=stage.clientWidth/390;$('#scheduleWrap').style.transform=`translate(${position.x*scale}px,${position.y*scale}px)`;localStorage.setItem(positionKey,JSON.stringify(position))}$('#posX').value=position.x;$('#posY').value=position.y;$('#posX').oninput=updatePosition;$('#posY').oninput=updatePosition;$('#resetPosition').onclick=()=>{$('#posX').value=0;$('#posY').value=0;updatePosition()};$('#opacity').value=opacity;function updateOpacity(){opacity=Number($('#opacity').value);$('#opacityValue')
