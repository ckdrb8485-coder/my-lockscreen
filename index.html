<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#252d35"><meta name="apple-mobile-web-app-capable" content="yes"><title>나의 잠금화면 일정</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#fff}*{box-sizing:border-box}body{margin:0;background:#242b35}button,input{font:inherit}button{cursor:pointer}.app{min-height:100svh;position:relative;isolation:isolate;padding:calc(env(safe-area-inset-top) + 25px) 20px calc(env(safe-area-inset-bottom) + 35px);max-width:600px;margin:auto}.bg{position:absolute;inset:0;z-index:-2;background:linear-gradient(145deg,#526e80,#a19e9d 55%,#55536a);background-size:cover;background-position:center}.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,22,31,.25),rgba(11,18,27,.48))}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:2px;opacity:.8}.heading{font-size:30px;font-weight:700;margin:10px 0 3px}.sub{opacity:.8;font-size:13px}.actions{display:flex;gap:8px;margin:25px 0}.btn{border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.17);color:white;border-radius:16px;padding:12px 14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:13px;font-weight:600}.btn.primary{background:rgba(255,255,255,.9);color:#27313b;border:0}.glass{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.3);box-shadow:0 14px 45px rgba(0,0,0,.11);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:25px;padding:19px}.week-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.week-head strong{font-size:17px}.nav{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:6px 12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.day{border:0;background:transparent;color:#fff;border-radius:13px;padding:9px 1px;display:flex;align-items:center;flex-direction:column;gap:8px}.day small{font-size:11px;opacity:.7}.day b{font-size:15px}.day.selected{background:rgba(255,255,255,.86);color:#303b46}.day.selected small{opacity:1}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 12px;font-size:17px;font-weight:700}.count{font-size:12px;opacity:.7}.events{display:grid;gap:9px}.event{width:100%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:white;text-align:left;border-radius:17px;padding:14px;display:flex;align-items:center;gap:12px}.dot{width:5px;height:34px;background:#d9f4df;border-radius:9px}.event-info{flex:1}.event-info strong{display:block;font-size:14px}.event-info span{display:block;font-size:12px;opacity:.7;margin-top:4px}.empty{text-align:center;padding:35px 15px;font-size:13px;opacity:.75}.hint{text-align:center;font-size:11px;opacity:.7;margin-top:24px;line-height:1.6}dialog{border:1px solid #e5e7eb;border-radius:22px;padding:23px;width:calc(100% - 36px);max-width:440px;color:#26313c}dialog::backdrop{background:rgba(0,0,0,.55)}dialog h2{margin:0 0 17px;font-size:21px}label{display:block;font-size:13px;margin:13px 0 5px}input[type=text],input[type=date],input[type=time]{display:block;width:100%;padding:12px;border:1px solid #cbd1d8;border-radius:11px;background:#fff;color:#26313c}.form-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.form-actions button{padding:11px 15px;border:0;border-radius:12px;background:#293d4e;color:white}.form-actions .muted{background:#e8edf1;color:#26313c}.form-actions .danger{background:#a33b3b}#photo{display:none}
</style></head><body><main class="app"><div class="bg" id="bg"></div><div class="shade"></div><div class="top"><div class="eyebrow">MY LITTLE MOMENTS</div><span id="todayLabel" class="sub"></span></div><h1 class="heading">나의 한 주</h1><div class="sub">소중한 순간을 차곡차곡 기록해요.</div><div class="actions"><button class="btn" id="pickPhoto">＋ 배경 사진</button><button class="btn primary" id="add">＋ 일정 추가</button><button class="btn" id="save">↓ 이미지 저장</button></div><input type="file" id="photo" accept="image/*"><section class="glass"><div class="week-head"><strong id="weekLabel"></strong><div><button class="nav" id="prev" aria-label="이전 주">‹</button> <button class="nav" id="next" aria-label="다음 주">›</button></div></div><div class="days" id="days"></div></section><div class="section-title"><span id="selectedLabel">일정</span><span class="count" id="count"></span></div><div class="events" id="events"></div><div class="hint">일정을 누르면 수정하거나 삭제할 수 있어요.<br>이미지 저장은 선택한 주의 일정을 담습니다.</div></main><dialog id="editor"><form id="eventForm"><h2 id="formTitle">일정 추가</h2><label for="name">일정 이름</label><input id="name" type="text" maxlength="80" required placeholder="예: 친구와 점심"><label for="date">날짜</label><input id="date" type="date" required><label for="time">시간 (선택)</label><input id="time" type="time"><div class="form-actions"><button type="submit">저장</button><button type="button" class="muted" id="cancel">취소</button><button type="button" class="danger" id="delete" hidden>삭제</button></div></form></dialog><script>
const $=s=>document.querySelector(s),key='my-lockscreen-v2-events',photoKey='my-lockscreen-v2-photo';let events=[],selected=new Date(),weekShift=0,editId=null,bgData='';const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,dayNames=['일','월','화','수','목','금','토'];try{events=JSON.parse(localStorage.getItem(key)||'[]');bgData=localStorage.getItem(photoKey)||''}catch{}if(bgData)$('#bg').style.backgroundImage=`url(${JSON.stringify(bgData)})`;function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7+weekShift*7);return x}function dates(){let m=monday(new Date());return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d})}function render(){const ds=dates(),first=ds[0],last=ds[6];$('#todayLabel').textContent=`${new Date().getMonth()+1}월 ${new Date().getDate()}일`;$('#weekLabel').textContent=`${first.getMonth()+1}월 ${first.getDate()}일 — ${last.getMonth()+1}월 ${last.getDate()}일`;$('#days').replaceChildren();ds.forEach(d=>{let b=document.createElement('button');b.className='day'+(iso(d)===iso(selected)?' selected':'');b.innerHTML=`<small>${dayNames[d.getDay()]}</small><b>${d.getDate()}</b>`;b.onclick=()=>{selected=d;render()};$('#days').append(b)});$('#selectedLabel').textContent=`${selected.getMonth()+1}월 ${selected.getDate()}일 · ${dayNames[selected.getDay()]}요일`;const list=events.filter(e=>e.date===iso(selected)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('#count').textContent=`${list.length}개의 일정`;$('#events').replaceChildren();if(!list.length){let e=document.createElement('div');e.className='glass empty';e.textContent='아직 일정이 없어요. 오늘의 순간을 추가해 보세요.';$('#events').append(e)}list.forEach(e=>{let b=document.createElement('button');b.className='event';let dot=document.createElement('span');dot.className='dot';let info=document.createElement('span');info.className='event-info';let title=document.createElement('strong');title.textContent=e.name;let time=document.createElement('span');time.textContent=e.time||'하루 종일';info.append(title,time);b.append(dot,info);b.onclick=()=>openEditor(e);$('#events').append(b)})}function openEditor(e){editId=e?.id||null;$('#formTitle').textContent=e?'일정 수정':'일정 추가';$('#name').value=e?.name||'';$('#date').value=e?.date||iso(selected);$('#time').value=e?.time||'';$('#delete').hidden=!e;$('#editor').showModal()}$('#add').onclick=()=>openEditor();$('#cancel').onclick=()=>$('#editor').close();$('#eventForm').onsubmit=ev=>{ev.preventDefault();let obj={id:editId||String(Date.now())+Math.random(),name:$('#name').value.trim(),date:$('#date').value,time:$('#time').value};if(!obj.name)return;events=editId?events.map(e=>e.id===editId?obj:e):[...events,obj];localStorage.setItem(key,JSON.stringify(events));selected=new Date(obj.date+'T12:00:00');weekShift=0;let today=monday(new Date()),target=new Date(selected);target.setDate(target.getDate()-(target.getDay()+6)%7);weekShift=Math.round((target-today)/604800000);$('#editor').close();render()};$('#delete').onclick=()=>{if(!confirm('이 일정을 삭제할까요?'))return;events=events.filter(e=>e.id!==editId);localStorage.setItem(key,JSON.stringify(events));$('#editor').close();render()};$('#prev').onclick=()=>{weekShift--;selected=dates()[0];render()};$('#next').onclick=()=>{weekShift++;selected=dates()[0];render()};$('#pickPhoto').onclick=()=>$('#photo').click();$('#photo').onchange=()=>{let file=$('#photo').files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1500/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);bgData=c.toDataURL('image/jpeg',.82);$('#bg').style.backgroundImage=`url(${JSON.stringify(bgData)})`;try{localStorage.setItem(photoKey,bgData)}catch{alert('사진은 적용되었지만 저장 공간 부족으로 다음 실행 시 유지되지 않을 수 있어요.')}};img.src=reader.result};reader.readAsDataURL(file)};
$('#save').onclick=async()=>{const c=document.createElement('canvas');c.width=1290;c.height=2796;const x=c.getContext('2d');const paint=()=>{let g=x.createLinearGradient(0,0,1290,2796);g.addColorStop(0,'#536f80');g.addColorStop(1,'#4a4b60');x.fillStyle=g;x.fillRect(0,0,1290,2796)};paint();if(bgData){try{let im=new Image();im.src=bgData;await im.decode();let scale=Math.max(c.width/im.width,c.height/im.height),w=im.width*scale,h=im.height*scale;x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h)}catch{}}let shade=x.createLinearGradient(0,0,0,2796);shade.addColorStop(0,'rgba(0,0,0,.2)');shade.addColorStop(1,'rgba(0,0,0,.6)');x.fillStyle=shade;x.fillRect(0,0,1290,2796);x.fillStyle='#fff';x.textAlign='center';x.font='500 44px sans-serif';x.fillText('MY LITTLE MOMENTS',645,680);x.font='bold 90px sans-serif';x.fillText('나의 한 주',645,815);const ds=dates();x.font='42px sans-serif';x.fillText(`${ds[0].getMonth()+1}.${ds[0].getDate()} — ${ds[6].getMonth()+1}.${ds[6].getDate()}`,645,890);x.fillStyle='rgba(255,255,255,.19)';x.beginPath();x.roundRect(85,1030,1120,Math.min(1230,245+events.filter(e=>ds.some(d=>iso(d)===e.date)).length*90),42);x.fill();x.fillStyle='#fff';x.textAlign='left';x.font='bold 48px sans-serif';x.fillText('이번 주 일정',145,1130);let weekly=events.filter(e=>ds.some(d=>iso(d)===e.date)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));x.font='37px sans-serif';if(!weekly.length)x.fillText('등록된 일정이 없어요',145,1240);weekly.slice(0,10).forEach((e,i)=>{let d=new Date(e.date+'T12:00:00');let text=`${d.getMonth()+1}/${d.getDate()}  ${e.time||'종일'}  ${e.name}`;while(x.measureText(text).width>980&&text.length>6)text=text.slice(0,-2)+'…';x.fillText(text,145,1240+i*90)});const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!blob)return alert('이미지 생성에 실패했습니다.');const file=new File([blob],'my-lockscreen.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'나의 잠금화면'});return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-lockscreen.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></body></html>
